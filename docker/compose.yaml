services:
  fastlio:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        ROS_DISTRO: ${ROS_DISTRO:-humble}
    image: fastlio-ros2:${ROS_DISTRO:-humble}
    network_mode: host
    privileged: true
    stdin_open: true
    tty: true
    gpus: all

    environment:
      ROS_DISTRO: ${ROS_DISTRO:-humble}
      DISPLAY: ${DISPLAY}
      XAUTHORITY: ${XAUTHORITY:-$HOME/.Xauthority}
      QT_X11_NO_MITSHM: "1"
      XDG_RUNTIME_DIR: /tmp/runtime-root
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      USE_TMUX: "1"
      TMUX_SESSION: fastlio

    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-$HOME/.Xauthority}:${XAUTHORITY:-$HOME/.Xauthority}:ro
      - ./:/root/fastlio_ws/src/fast_lio_ros2:rw
      - ./.fastlio_cache/${ROS_DISTRO:-humble}/build:/root/fastlio_ws/build:rw
      - ./.fastlio_cache/${ROS_DISTRO:-humble}/install:/root/fastlio_ws/install:rw
      - ./.fastlio_cache/${ROS_DISTRO:-humble}/log:/root/fastlio_ws/log:rw

    command: ["bash", "-lc", "tmux new -A -s fastlio"]